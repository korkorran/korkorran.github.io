<article>
{% if has_banner %}  <img class="post-banner" src="{{ banner }}" alt="">
{% endif %}  <h1>{{ title }}</h1>
  <p class="post-meta">
    <time datetime="{{ date.repr.date }}">{{ date.repr.date }}</time>
{% if has_tags %}    <span class="tags">
{% for tag in tags %}      <span class="tag">{{ tag }}</span>
{% endfor %}    </span>
{% endif %}  </p>

{{ yocaml_body | safe }}
</article>

<section class="comments">
  <h2>Comments</h2>
  <!-- giscus places the thread in this element, and stores it as a GitHub
       Discussion keyed on the page's pathname. -->
  <div class="giscus"></div>
</section>

<script src="https://giscus.app/client.js"
        data-repo="korkorran/korkorran.github.io"
        data-repo-id="R_kgDOTym4yA"
        data-category="General"
        data-category-id="DIC_kwDOTym4yM4DEVnw"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="en"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
</script>
