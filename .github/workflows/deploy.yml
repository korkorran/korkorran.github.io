name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install oniguruma
        run: sudo apt-get update && sudo apt-get install -y libonig-dev

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"
          dune-cache: true

      # opam invokes curl with `--retry 10`, but curl does not retry TLS
      # handshake failures (exit 35) — only HTTP and timeout errors. A transient
      # SSL error while fetching one source therefore fails the whole job on the
      # first try, so retry the step itself.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if opam install . --deps-only --yes; then
              exit 0
            fi
            echo "::warning::opam install failed (attempt $attempt/3), retrying in 20s"
            sleep 20
          done
          echo "::error::opam install failed after 3 attempts"
          exit 1

      - name: Build the site
        run: opam exec -- dune exec bin/main.exe -- build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
